name: Quotex OTC Signal & Report Scheduler

on:
  schedule:
    - cron: '15 3 * * *'
    - cron: '35 4 * * *'
    - cron: '15 14 * * *'
    - cron: '35 15 * * *'
  
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Choose Action (signal or report)'
        required: true
        default: 'signal'
        type: choice
        options:
          - signal
          - report

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # If triggered manually via workflow_dispatch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.action_type }}" == "report" ]; then
              python bot_main.py report
            else
              python bot_main.py
            fi
          else
            # Automatic cron schedule logic
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq 3 ] || [ "$HOUR" -eq 14 ]; then
              python bot_main.py
            else
              python bot_main.py report
            fi
          fi
