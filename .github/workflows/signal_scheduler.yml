import json
import os
from datetime import datetime, timedelta
from config import TIMEZONE

class SignalEngine:
    def __init__(self):
        self.real_pairs = ["EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CAD", "USD/CHF", "EUR/JPY", "GBP/JPY"]
        self.otc_pairs = [p + " OTC" for p in self.real_pairs]
        self.storage_file = "last_session.json"

    def is_otc_market(self, dt):
        return dt.weekday() >= 5

    def generate_filtered_signals(self, session_start_time, target_count=10):
        signals = []
        is_otc = self.is_otc_market(session_start_time)
        pairs_to_use = self.otc_pairs if is_otc else self.real_pairs
        
        current_time = session_start_time + timedelta(minutes=4)
        directions = ["CALL", "PUT"]
        
        for i in range(target_count):
            sig_time = current_time.strftime("%H:%M")
            pair = pairs_to_use[i % len(pairs_to_use)]
            direction = directions[i % 2]
            
            signals.append({
                "time": sig_time,
                "pair": pair,
                "direction": direction
            })
            current_time += timedelta(minutes=4)

        # সিগন্যাল ফাইলটিতে স্থায়ীভাবে সেভ রাখা হচ্ছে যেন রির্পোট ভুল না হয়
        with open(self.storage_file, "w") as f:
            json.dump(signals, f)

        return signals

    def load_saved_signals(self):
        if os.path.exists(self.storage_file):
            with open(self.storage_file, "r") as f:
                return json.load(f)
        return []
